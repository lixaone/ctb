<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Catch the Falling Ball</title>
<style>
    body {
        margin: 0;
        background: #222; 
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
    }
    canvas {
        background: #333;
        display: block;
        margin: 20px auto;
        border: 2px solid #fff;
    }
</style>
</head>
<body>

<h1>Catch the Falling Ball 🎯</h1>
<p>Move with Left ⬅ and Right ➡ arrow keys</p>
<canvas id="gameCanvas" width="400" height="500"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Player properties
const player = {
    x: canvas.width / 2 - 30,
    y: canvas.height - 20,
    width: 60,
    height: 10,
    speed: 5
};

// Ball properties
let ball = {
    x: Math.random() * (canvas.width - 20) + 10,
    y: 0,
    radius: 10,
    speed: 2
};

let score = 0;
let keys = {};

// Listen for key presses
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

function update() {
    // Move player
    if (keys["ArrowLeft"] && player.x > 0) {
        player.x -= player.speed;
    }
    if (keys["ArrowRight"] && player.x < canvas.width - player.width) {
        player.x += player.speed;
    }

    // Move ball
    ball.y += ball.speed;

    // Check if ball caught
    if (
        ball.y + ball.radius >= player.y &&
        ball.x >= player.x &&
        ball.x <= player.x + player.width
    ) {
        score++;
        resetBall();
    }

    // Missed ball
    if (ball.y > canvas.height) {
        score = 0; // reset score
        resetBall();
    }
}

function resetBall() {
    ball.x = Math.random() * (canvas.width - 20) + 10;
    ball.y = 0;
    ball.speed = 2 + Math.random() * 3; // random speed
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw player
    ctx.fillStyle = "cyan";
    ctx.fillRect(player.x, player.y, player.width, player.height);

    // Draw ball
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fillStyle = "red";
    ctx.fill();
    ctx.closePath();

    // Draw score
    ctx.fillStyle = "white";
    ctx.font = "16px Arial";
    ctx.fillText("Score: " + score, 10, 20);
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
